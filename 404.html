<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página no encontrada · José Manrique Cruz</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .notfound__code {
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--coral);
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .notfound__title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(32px, 5vw, 48px);
    margin-bottom: 16px;
  }
  .notfound__text {
    color: var(--ink-dim);
    max-width: 46ch;
    margin-bottom: 36px;
    font-size: 16.5px;
  }
</style>
</head>
<body>
  <div class="notfound">
    <span class="notfound__code">error: 404</span>
    <h1 class="notfound__title">Esta página no existe</h1>
    <p class="notfound__text">
      El enlace que seguiste no lleva a ningún lado — o el recurso se movió. Volvamos al inicio.
    </p>
    <a class="btn btn--primary" href="./">Volver al inicio ↩</a>
  </div>
</body>
</html>
